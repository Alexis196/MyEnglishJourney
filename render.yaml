services:
  - type: web
    name: myenglishjourney-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:backend
    startCommand: npm run start:backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://my-english-journey-3aia.vercel.app
      # Secrets are intentionally not committed here — set these in the Render
      # dashboard (Environment tab) instead: SUPABASE_URL, SUPABASE_ANON_KEY,
      # SUPABASE_SERVICE_ROLE_KEY, GEMINI_API_KEY, GEMINI_MODEL, OPENAI_API_KEY,
      # OPENAI_MODEL. See backend/.env.example for what each one is.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
